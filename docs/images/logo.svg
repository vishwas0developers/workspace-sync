<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#9B51E0" />
    </linearGradient>
    <linearGradient id="mintCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFD1" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(40, 10)">
    <!-- Hexagon Outer Network Structure -->
    <polygon points="120,15 210,65 210,175 120,225 30,175 30,65" fill="none" stroke="url(#cyanPurple)" stroke-width="4.5" filter="url(#glow)" />
    
    <!-- Geometric Interconnections -->
    <line x1="120" y1="15" x2="120" y2="225" stroke="#00F2FE" stroke-width="1.5" opacity="0.35" />
    <line x1="30" y1="65" x2="210" y2="175" stroke="#00F2FE" stroke-width="1.5" opacity="0.35" />
    <line x1="30" y1="175" x2="210" y2="65" stroke="#00F2FE" stroke-width="1.5" opacity="0.35" />

    <!-- Corner Nodes -->
    <circle cx="120" cy="15" r="7" fill="#00FFD1" filter="url(#glow)"/>
    <circle cx="210" cy="65" r="7" fill="#00F2FE" filter="url(#glow)"/>
    <circle cx="210" cy="175" r="7" fill="#9B51E0" filter="url(#glow)"/>
    <circle cx="120" cy="225" r="7" fill="#00FFD1" filter="url(#glow)"/>
    <circle cx="30" cy="175" r="7" fill="#00F2FE" filter="url(#glow)"/>
    <circle cx="30" cy="65" r="7" fill="#9B51E0" filter="url(#glow)"/>

    <!-- Central Cloud & Sync Core -->
    <g transform="translate(68, 52)">
      <!-- Cloud Outline -->
      <path d="M 20 60 A 25 25 0 0 1 65 32 A 30 30 0 0 1 104 55 A 22 22 0 0 1 108 92 L 20 92 Z" fill="none" stroke="url(#cyanPurple)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
      
      <!-- Sync Loop Arrows -->
      <path d="M 40 68 A 18 18 0 0 1 76 68" fill="none" stroke="url(#mintCyan)" stroke-width="4.5" stroke-linecap="round" />
      <polygon points="76,68 68,61 71,76" fill="#00FFD1" />

      <path d="M 76 82 A 18 18 0 0 1 40 82" fill="none" stroke="url(#mintCyan)" stroke-width="4.5" stroke-linecap="round" />
      <polygon points="40,82 48,89 45,74" fill="#00FFD1" />
    </g>
  </g>

  <!-- Branding Text -->
  <text x="285" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="58" fill="#FFFFFF" letter-spacing="1.5">Workspace<tspan fill="url(#cyanPurple)">Sync</tspan></text>
  <text x="288" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="19" fill="#00FFD1" letter-spacing="3" opacity="0.95">MCP SERVER &amp; MULTI-PROJECT SYNC</text>
</svg>
